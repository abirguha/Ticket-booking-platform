<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style_movie3.css">
    <title>Document</title>
</head>
<body>
    <div class="background-image">
        <div class="previous-page">
            <img src="#" alt="" class="btn-alt">
        </div>
        <div class="book">
            <div class="left">
                <img src="images/substance.jpg" alt="" class="poster">
            </div>
            <div class="right">
                <div class="movie-title">
                    <h1 class="title">The Substance</h1>
                </div>
                <div class="movie-ratings">
                    <div class="rating">
                        <img src="images/star.png" alt="" class="star">
                        <h3 class="rate">7.2</h3>
                    </div>
                </div>
                <div class="movie-summary">
                    <h3>A fading celebrity decides to use a black market drug, a cell-replicating substance that temporarily creates a younger, better version of herself.</h3>
                </div>
                <div class="movie-booking">
                    <h3><a href="/booking.html" class="btn">Book Tickets</a></h3>
                </div>
            </div>
        </div>
        <div class="movie-trailer">
            <h1 class="trailer">Trailer</h1>
            <div class="trailer-link">
                <iframe width="560" height="315" src="https://www.youtube.com/embed/LNlrGhBpYjc?si=7qibg3MR97eJdusf" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
        </div>
        <div class="movie-cast"></div>
    </div>
</body>
</html>
