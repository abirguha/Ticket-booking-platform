<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible"
          content="IE=edge">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'
          rel='stylesheet'>

    <link rel="stylesheet"
          href="style.css">

    <title>Login & Registration</title>

</head>


<body>


<div class="wrapper">


    <!-- =====================================================
         NAVIGATION
         ===================================================== -->

    <nav class="nav">


        <div class="nav-menu"
             id="navMenu">

            <ul>

                <li>
                    <a href="#"
                       class="link active">

                        Home

                    </a>
                </li>


                <li>
                    <a href="#"
                       class="link">

                        About

                    </a>
                </li>

            </ul>

        </div>


        <div class="nav-button">

            <button
                class="btn white-btn"
                id="loginBtn"
                onclick="login()">

                Sign In

            </button>


            <button
                class="btn"
                id="registerBtn"
                onclick="register()">

                Sign Up

            </button>

        </div>


        <div class="nav-menu-btn">

            <i
                class="bx bx-menu"
                onclick="myMenuFunction()">
            </i>

        </div>

    </nav>



    <form
        name="myForm"
        method="post">


        <!-- =================================================
             FORM BOX
             ================================================= -->

        <div class="form-box">


            <!-- =============================================
                 LOGIN FORM
                 ============================================= -->

            <div
                class="login-container"
                id="login">


                <div class="top">

                    <span>

                        Don't have an account?

                        <a
                            href="#"
                            onclick="register()">

                            Sign Up

                        </a>

                    </span>


                    <header>

                        Login

                    </header>

                </div>



                <!-- EMAIL -->

                <div class="input-box">

                    <input
                        type="email"
                        class="input-field"
                        placeholder="Email"
                        name="Uname"
                        onkeydown="if(event.key === 'Enter'){event.preventDefault(); Login();}"
                    >

                </div>



                <!-- PASSWORD -->

                <div class="input-box">

                    <input
                        type="password"
                        class="input-field"
                        placeholder="Password"
                        name="Pass"
                        onkeydown="if(event.key === 'Enter'){event.preventDefault(); Login();}"
                    >

                    <i class="bx bx-lock-alt"></i>

                </div>



                <!-- LOGIN BUTTON -->

                <div class="input-box">

                    <input
                        type="button"
                        class="submit"
                        value="Sign In"
                        onclick="Login()"
                    >

                </div>



                <!-- FORGOT PASSWORD -->

                <div class="two-col">

                    <div class="two">

                        <label>

                            <a href="#">

                                Forgot password?

                            </a>

                        </label>

                    </div>

                </div>


            </div>



            <!-- =============================================
                 REGISTRATION FORM
                 ============================================= -->

            <div
                class="register-container"
                id="register">


                <div class="top">

                    <span>

                        Have an account?

                        <a
                            href="#"
                            onclick="login()">

                            Login

                        </a>

                    </span>


                    <header>

                        Sign Up

                    </header>

                </div>



                <!-- FIRST NAME + LAST NAME -->

                <div class="two-forms">


                    <div class="input-box">

                        <input
                            type="text"
                            class="input-field"
                            placeholder="Firstname"
                            id="firstName"
                        >

                        <i class="bx bx-user"></i>

                    </div>



                    <div class="input-box">

                        <input
                            type="text"
                            class="input-field"
                            placeholder="Lastname"
                            id="lastName"
                        >

                        <i class="bx bx-user"></i>

                    </div>


                </div>



                <!-- SIGNUP EMAIL -->

                <div class="input-box">

                    <input
                        type="email"
                        class="input-field"
                        placeholder="Email"
                        id="email"
                        name="signupEmail"
                        onkeydown="if(event.key === 'Enter'){event.preventDefault(); signup();}"
                    >

                    <i class="bx bx-envelope"></i>

                </div>



                <!-- SIGNUP PASSWORD -->

                <div class="input-box">

                    <input
                        type="password"
                        class="input-field"
                        placeholder="Password"
                        id="signupPassword"
                        name="signupPass"
                        onkeydown="if(event.key === 'Enter'){event.preventDefault(); signup();}"
                    >

                    <i class="bx bx-lock-alt"></i>

                </div>



                <!-- REGISTER BUTTON -->

                <div class="input-box">

                    <input
                        type="button"
                        class="submit"
                        value="Register"
                        onclick="signup()"
                    >

                </div>



                <!-- TERMS -->

                <div class="two-col">

                    <div class="two">

                        <label>

                            <a href="#">

                                Terms & conditions

                            </a>

                        </label>

                    </div>

                </div>


            </div>


        </div>


    </form>


</div>



<!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

<script src="function.js"></script>


</body>

</html>
