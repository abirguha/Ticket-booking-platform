<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style_movie2.css">
    <title>Document</title>
</head>
<body>
    <div class="background-image">
        <div class="previous-page">
            <img src="#" alt="" class="btn-alt">
        </div>
        <div class="book">
            <div class="left">
                <img src="images/alien.jpg" alt="" class="poster">
            </div>
            <div class="right">
                <div class="movie-title">
                    <h1 class="title">Alien: Romulus</h1>
                </div>
                <div class="movie-ratings">
                    <div class="rating">
                        <img src="images/star.png" alt="" class="star">
                        <h3 class="rate">7.3</h3>
                    </div>
                </div>
                <div class="movie-summary">
                    <h3>While scavenging the deep ends of a derelict space station, a group of young space colonizers come face to face with the most terrifying life form in the universe.</h3>
                </div>
                <div class="movie-booking">
                    <h3><a href="/booking.html" class="btn">Book Tickets</a></h3>
                </div>
            </div>
        </div>
        <div class="movie-trailer">
            <h1 class="trailer">Trailer</h1>
            <div class="trailer-link">
                <iframe width="560" height="315" src="https://www.youtube.com/embed/x0XDEhP4MQs?si=I1dr2mgvpaCltC-M" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
        </div>
        <div class="movie-cast"></div>
    </div>
</body>
</html>
