    <style>

        /* =====================================================
           DATE INPUT
           ===================================================== */

        #filterDate {

            width: 100%;
            box-sizing: border-box;

            padding: 8px 10px;

            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 5px;

        /* =====================================================
           FILTER STATUS
           ===================================================== */

            margin-top: 12px;

            text-align: center;

            font-size: 14px;

            color: #aaa;

        }


        /* =====================================================
           NO RESULTS
           ===================================================== */

        #noMoviesMessage {

            display: none;

            width: 100%;

            text-align: center;

            padding: 40px 20px;

            box-sizing: border-box;

        }


        #noMoviesMessage h2 {

            color: white;

            margin-bottom: 8px;

        }

        .catalogue-movie[hidden] {
            display: none !important;
        }


        #noMoviesMessage p {

            color: #aaa;

        }


        /* =====================================================
           LOGOUT
           ===================================================== */

        .logout-link {

            cursor: pointer;

        }


        .logout-link:hover {

            color: #ff5c5c !important;

        }

    </style>

    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script>


        /* =====================================================
           LOCAL FLASK SERVER
           ===================================================== */

        const API_BASE_URL =
            "http://127.0.0.1:5000";



        /* =====================================================
           SHOWTIMES

           These match the existing booking system.

           Morning:
           05:00 - 11:59

           Noon:
           12:00 - 17:59

           Night:
           18:00 - 04:59
           ===================================================== */

        const SHOWTIMES = [

            {
                type: "2D",
                time: "09:00"
            },

            {
                type: "2D",
                time: "12:00"
            },

            {
                type: "2D",
                time: "15:00"
            },

            {
                type: "2D",
                time: "18:00"
            },

            {
                type: "2D",
                time: "21:00"
            },

            {
                type: "3D",
                time: "10:00"
            },

            {
                type: "3D",
                time: "13:00"
            },

            {
                type: "3D",
                time: "16:00"
            },

            {
                type: "3D",
                time: "19:00"
            },

            {
                type: "3D",
                time: "22:00"
            }

        ];



        /* =====================================================
           ELEMENTS
           ===================================================== */

        const filterDate =
            document.getElementById(
                "filterDate"
            );


        const applyFiltersButton =
            document.getElementById(
                "applyFilters"
            );


        const filterStatus =
            document.getElementById(
                "filterStatus"
            );


        const noMoviesMessage =
            document.getElementById(
                "noMoviesMessage"
            );


        const logoutButton =
            document.getElementById(
                "logoutButton"
            );



        /* =====================================================
           TODAY'S DATE
           ===================================================== */

        function getTodayDate() {

            const today =
                new Date();


            const year =
                today.getFullYear();


            const month =
                String(
                    today.getMonth() + 1
                ).padStart(
                    2,
                    "0"
                );


            const day =
                String(
                    today.getDate()
                ).padStart(
                    2,
                    "0"
                );


            return (
                year +
                "-" +
                month +
                "-" +
                day
            );

        }



        /* =====================================================
           INITIALISE DATE
           ===================================================== */

        function initialiseDate() {

            const today =
                getTodayDate();


            /*
             * Browser calendar cannot go before today.
             */

            filterDate.min =
                today;


            const savedDate =
                localStorage.getItem(
                    "selected_booking_date"
                );


            /*
             * Use saved date only if it is today or later.
             */

            if (
                savedDate &&
                /^\d{4}-\d{2}-\d{2}$/.test(
                    savedDate
                ) &&
                savedDate >= today
            ) {

                filterDate.value =
                    savedDate;

            } else {

                filterDate.value =
                    today;

                localStorage.setItem(
                    "selected_booking_date",
                    today
                );

            }

        }



        /* =====================================================
           DATE CHANGE
           ===================================================== */

        filterDate.addEventListener(
            "change",
            function() {

                const today =
                    getTodayDate();


                /*
                 * Extra protection against manually
                 * entering a past date.
                 */

                if (
                    !filterDate.value ||
                    filterDate.value < today
                ) {

                    filterDate.value =
                        today;

                }


                localStorage.setItem(
                    "selected_booking_date",
                    filterDate.value
                );


                /*
                 * Remove old result text.
                 */

                filterStatus.textContent =
                    "";

            }
        );



        /* =====================================================
           SELECTED CATEGORIES
           ===================================================== */

        function getSelectedCategories() {

            return Array.from(
                document.querySelectorAll(
                    'input[name="category"]:checked'
                )
            ).map(
                function(input) {

                    return input.value
                        .toLowerCase();

                }
            );

        }



        /* =====================================================
           SELECTED LANGUAGES
           ===================================================== */

        function getSelectedLanguages() {

            return Array.from(
                document.querySelectorAll(
                    'input[name="language"]:checked'
                )
            ).map(
                function(input) {

                    return input.value
                        .toLowerCase();

                }
            );

        }



        /* =====================================================
           SELECTED TIME
           ===================================================== */

        function getSelectedTime() {

            const selected =
                document.querySelector(
                    'input[name="time"]:checked'
                );


            return selected
                ? selected.value
                : null;

        }



        /* =====================================================
           TIME PERIOD
           ===================================================== */

        function getTimePeriod(
            time
        ) {

            const hour =
                Number(
                    time.split(":")[0]
                );


            if (
                hour >= 5 &&
                hour < 12
            ) {

                return "morning";

            }


            if (
                hour >= 12 &&
                hour < 18
            ) {

                return "noon";

            }


            return "night";

        }



        /* =====================================================
           SHOWTIMES FOR PERIOD
           ===================================================== */

        function getShowtimesForPeriod(
            period
        ) {

            return SHOWTIMES.filter(
                function(show) {

                    return (
                        getTimePeriod(
                            show.time
                        ) === period
                    );

                }
            );

        }



        /* =====================================================
           BASIC FILTER MATCH
           ===================================================== */

        function movieMatchesBasicFilters(
            movie,
            selectedCategories,
            selectedLanguages
        ) {

            const movieCategories =
                (
                    movie.dataset.categories ||
                    ""
                )
                .toLowerCase()
                .split(/\s+/)
                .filter(Boolean);


            const movieLanguage =
                (
                    movie.dataset.language ||
                    ""
                )
                .toLowerCase();


            /*
             * Category filters use OR.
             *
             * Example:
             * Action + Comedy
             *
             * means Action OR Comedy.
             */

            if (
                selectedCategories.length > 0
            ) {

                const categoryMatch =
                    selectedCategories.some(
                        function(category) {

                            return movieCategories.includes(
                                category
                            );

                        }
                    );


                if (!categoryMatch) {

                    return false;

                }

            }


            /*
             * Language filters use OR.
             */

            if (
                selectedLanguages.length > 0
            ) {

                const languageMatch =
                    selectedLanguages.includes(
                        movieLanguage
                    );


                if (!languageMatch) {

                    return false;

                }

            }


            return true;

        }



        /* =====================================================
           APPLY FILTERS
           ===================================================== */

        async function applyMovieFilters() {

            const selectedCategories =
                getSelectedCategories();


            const selectedLanguages =
                getSelectedLanguages();


            const selectedTime =
                getSelectedTime();


            const bookingDate =
                filterDate.value ||
                getTodayDate();


            const movies =
                Array.from(
                    document.querySelectorAll(
                        ".catalogue-movie"
                    )
                );


            localStorage.setItem(
                "selected_booking_date",
                bookingDate
            );


            filterStatus.textContent =
                "Searching...";


            applyFiltersButton.style.pointerEvents =
                "none";


            applyFiltersButton.style.opacity =
                "0.6";


            noMoviesMessage.style.display =
                "none";


            /*
             * Always hide everything first.
             * The hidden property cannot be overridden
             * by the existing movie-card CSS.
             */

            movies.forEach(
                function(movie) {
                    movie.hidden = true;
                }
            );


            try {

                /*
                 * First apply category and language.
                 */

                const candidateMovies =
                    movies.filter(
                        function(movie) {

                            return movieMatchesBasicFilters(
                                movie,
                                selectedCategories,
                                selectedLanguages
                            );

                        }
                    );


                let visibleCount =
                    0;


                /*
                 * No time selected:
                 * show every category/language match.
                 */

                if (!selectedTime) {

                    candidateMovies.forEach(
                        function(movie) {

                            movie.hidden = false;
                            visibleCount++;

                        }
                    );

                }


                /*
                 * Time selected:
                 * check the real showtime availability
                 * for every matching movie.
                 */

                else {

                    /*
                     * Check every candidate movie and every showtime
                     * in the selected period with ONE backend request.
                     */

                    const movieNames =
                        candidateMovies.map(
                            function(movie) {
                                return movie.dataset.movieName;
                            }
                        );


                    const params =
                        new URLSearchParams({

                            booking_date:
                                bookingDate,

                            period:
                                selectedTime,

                            movie_names:
                                movieNames.join("|")

                        });


                    let availabilityData = {};


                    try {

                        const controller =
                            new AbortController();


                        const timeoutId =
                            setTimeout(
                                function() {
                                    controller.abort();
                                },
                                10000
                            );


                        const response =
                            await fetch(
                                API_BASE_URL +
                                "/movie-time-availability?" +
                                params.toString(),
                                {
                                    method: "GET",
                                    signal: controller.signal
                                }
                            );


                        clearTimeout(timeoutId);


                        if (!response.ok) {
                            throw new Error(
                                "Movie availability request failed"
                            );
                        }


                        const data =
                            await response.json();


                        availabilityData =
                            data.availability || {};

                    } catch (error) {

                        /*
                         * Keep technical errors out of the UI.
                         */

                        console.error(
                            "Movie availability:",
                            error
                        );

                        availabilityData = {};

                    }


                    candidateMovies.forEach(
                        function(movie) {

                            const movieName =
                                movie.dataset.movieName;


                            if (
                                availabilityData[movieName] === true
                            ) {

                                movie.hidden =
                                    false;

                                visibleCount++;

                            }

                        }
                    );

                }


                /*
                 * Final result.
                 */

                if (
                    visibleCount === 0
                ) {

                    noMoviesMessage.style.display =
                        "block";


                    filterStatus.textContent =
                        "No movies available.";

                } else {

                    filterStatus.textContent =
                        visibleCount +
                        (
                            visibleCount === 1
                                ? " movie available"
                                : " movies available"
                        );

                }


            } catch (error) {

                /*
                 * Never expose technical/API errors
                 * to the customer.
                 */

                console.error(
                    "Movie filter:",
                    error
                );


                movies.forEach(
                    function(movie) {
                        movie.hidden = true;
                    }
                );


                noMoviesMessage.style.display =
                    "block";


                filterStatus.textContent =
                    "No movies available.";

            }


            /*
             * Always restore the button.
             */

            applyFiltersButton.style.pointerEvents =
                "";


            applyFiltersButton.style.opacity =
                "";

        }


        /* =====================================================
           APPLY BUTTON
           ===================================================== */

        applyFiltersButton.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                applyMovieFilters();

            }
        );



        /* =====================================================
           LOGOUT
           ===================================================== */

        logoutButton.addEventListener(
            "click",
            function(event) {

                event.preventDefault();


                /*
                 * Remove customer login information.
                 */

                localStorage.removeItem(
                    "user_id"
                );


                localStorage.removeItem(
                    "user_name"
                );


                localStorage.removeItem(
                    "selected_booking_date"
                );


                localStorage.removeItem(
                    "selected_show_type"
                );


                localStorage.removeItem(
                    "selected_show_time"
                );


                localStorage.removeItem(
                    "selected_venue"
                );


                localStorage.removeItem(
                    "selected_venue_id"
                );


                localStorage.removeItem(
                    "confirmation_booking"
                );


                /*
                 * Return to login page.
                 */

                window.location.href =
                    "index.html";

            }
        );



        /* =====================================================
           INITIALISE PAGE
           ===================================================== */

        initialiseDate();

        document
            .querySelectorAll(".catalogue-movie")
            .forEach(function(movie) {
                movie.hidden = false;
            });


    </script>
