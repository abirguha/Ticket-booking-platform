<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style_home.css">
    <title>Home Page</title>
</head>
<body>
   <section class="top-bar">
        <div class="left-content">
            <h2 class="title">LOGO</h2>
            <ul class="navigation">
                <li><a class="active" href="#" >Home</a></li>
                <li><a href="#">Store</a></li>
            </ul>
        </div>
        <div class="right-content">
            <img src="/images/filter.png" alt="" class="filter">
            <img src="/images/cart.png" alt="" class="cart">
            <img src="/images/help.png" alt="" class="help">
            <div class="profile-img-box">
                <img src="/images/person.png" alt="">
            </div>
            <img src="/images/menu.png" alt="" class="menu">
        </div>
   </section>
   <section class="main-container">
        <div class="sidebar">
            <form action="#">
                <div class="sidebar-groups">
                    <h3 class="sg-title">Categories</h3>
                    <input type="checkbox" id="adventure" name="adventure" value="adventure">
                    <label for="adventure">Adventure</label><br>
                    <input type="checkbox" id="action" name="action" value="action">
                    <label for="action">Action</label><br>
                    <input type="checkbox" id="animation" name="animation" value="animation">
                    <label for="animation">Animation</label><br>
                    <input type="checkbox" id="comedy" name="comedy" value="comedy">
                    <label for="comedy">Comedy</label><br>
                    <input type="checkbox" id="science" name="science" value="science">
                    <label for="science">Science Fiction</label><br>
                    <input type="checkbox" id="thiller" name="thiller" value="thiller">
                    <label for="thiller">Thriller</label><br>
                    <input type="checkbox" id="history" name="history" value="history">
                    <label for="history">History</label><br>
                    <input type="checkbox" id="documentary" name="documentary" value="documentary">
                    <label for="documentary">Documentary</label><br>
                    <input type="checkbox" id="fantacy" name="fantacy" value="fantacy">
                    <label for="fantacy">Fantacy</label><br>
                </div>
                <div class="sidebar-groups">
                    <h3 class="sg-title">Language</h3>
                    <input type="checkbox" id="english" name="english" value="english">
                    <label for="english">English</label><br>
                    <input type="checkbox" id="hindi" name="hindi" value="hindi">
                    <label for="hindi">Hindi</label><br>
                    <input type="checkbox" id="bengali" name="bengali" value="bengali">
                    <label for="bengali">Bengali</label><br>
                </div>
                <div class="sidebar-groups">
                    <h3 class="sg-title">Time</h3>
                    <input type="radio" id="morning" name="time" value="morning">
                    <label for="morning">Morning</label><br>
                    <input type="radio" id="night" name="time" value="night">
                    <label for="night">Night</label>
                </div>
                <div class="sidebar-groups">
                    <a href="#" class="btn-1 btn">Apply Filters</a>
                </div>
            </form>
        </div>
        <div class="movies-container">
            <div class="upcoming-img-box">
                <img src="/images/Venom.jpg" alt="">
                <p class="upcoming-title">Upcoming Movies</p>
                <div class="buttons">
                    <a href="movie1.html" class="btn">Book Now</a>
                    <a href="https://youtu.be/HyIyd9joTTc?si=ucCxHpZA0cEmTzLw" class="btn-alt btn">Play Trailer</a>
                </div>
            </div>
            <div class="current-movies">
                <div class="current-movie">
                    <div class="cm-img-box">
                        <a href="movie2.html"><img src="/images/alien.jpg" alt=""></a>
                    </div>
                    <h3 class="movie-title">Alien: Romulus</h3>
                </div>
                <div class="current-movie">
                    <div class="cm-img-box">
                        <a href="movie3.html"><img src="/images/substance.jpg" alt=""></a>
                    </div>
                    <h3 class="movie-title">The Substance</h3>
                </div>
                <div class="current-movie">
                    <div class="cm-img-box">
                        <a href="movie4.html"><img src="/images/DandW.jpg" alt=""></a>
                    </div>
                    <h3 class="movie-title">Deadpool and Wolverine</h3>
                </div>
                <div class="current-movie">
                    <div class="cm-img-box">
                        <a href="movie5.html"><img src="/images/Tekka_poster.jpg" alt=""></a>
                    </div>
                    <h3 class="movie-title">Tekka</h3>
                </div>
                <div class="current-movie">
                    <div class="cm-img-box">
                        <a href="movie6.html"><img src="/images/stree.jpg" alt=""></a>
                    </div>
                    <h3 class="movie-title">Stree 2</h3>
                </div>
                <div class="current-movie">
                    <div class="cm-img-box">
                        <a href="movie7.html"><img src="/images/devara.jpg" alt=""></a>
                    </div>
                    <h3 class="movie-title">Devara - Part 1</h3>
                </div>
            </div>
        </div>
   </section>
</body>
</html>
