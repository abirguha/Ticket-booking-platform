<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="/style_booking.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <title>Venom: The Last Dance - Select Cinema</title>


    <!-- =====================================================
         CINEMA PAGE VISUAL DESIGN
         ===================================================== -->

    <style>

        /* =====================================================
           HEADER ROW
           ===================================================== */

        .venue-top-row {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            width: 100%;

            margin-bottom: 10px;

        }


        .venue-top-row h1 {

            margin: 0;

            text-align: left !important;

            flex: 1;

        }


        .venue-top-row .booking-info-pill {

            margin: 0 !important;

            flex-shrink: 0;

            white-space: nowrap;

        }


        /* =====================================================
           CINEMA LIST
           ===================================================== */

        #venue_list {

            width: 100%;

            max-height: none !important;

            overflow-y: visible !important;

            overflow-x: hidden;

            display: flex;

            flex-direction: column;

            gap: 12px;

            padding: 0 4px 4px 0;

            box-sizing: border-box;

        }


        /* =====================================================
           COMPACT CINEMA CARD
           ===================================================== */

        #venue_list .cinema-card {

            flex-shrink: 0;

            width: 100%;

            margin: 0;

            padding: 15px 20px !important;

            box-sizing: border-box;

            border-radius: 14px;

        }


        /* =====================================================
           CINEMA HEADER
           ===================================================== */

        #venue_list .cinema-header {

            margin-bottom: 8px !important;

        }


        #venue_list .cinema-info h3 {

            margin: 0;

            font-size: 19px;

            line-height: 1.25;

        }


        #venue_list .cinema-info p {

            margin: 3px 0 0;

            font-size: 12px;

        }


        /* =====================================================
           SHOWTIME TITLE
           ===================================================== */

        #venue_list .showtime-title {

            margin: 7px 0 5px !important;

            font-size: 12px;

        }


        /* =====================================================
           SHOWTIME BUTTONS
           ===================================================== */

        #venue_list .showtime-container {

            gap: 7px;

        }


        #venue_list .venue-showtime {

            padding: 7px 14px;

            border-radius: 8px;

            font-size: 12px;

            min-height: 32px;

        }


        /* =====================================================
           SHOWTIME LEGEND
           ===================================================== */

        #venue_list .showtime-legend {

            margin-top: 7px !important;

            font-size: 10px;

        }


        /* =====================================================
           CONTINUE BUTTON
           ===================================================== */

        #venue_continue_button {

            margin-top: 12px;

        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 700px) {

            .venue-top-row {

                flex-direction: column;

                align-items: flex-start;

                gap: 10px;

            }


            .venue-top-row h1 {

                text-align: left !important;

            }


            .venue-top-row .booking-info-pill {

                margin: 0 !important;

            }


            #venue_list {

                overflow: visible !important;

                max-height: none !important;

            }


            #venue_list .cinema-card {

                padding: 14px !important;

            }

        }

    </style>

</head>


<body>


    <div class="booking">


        <!-- =====================================================
             VENUE / SHOWTIME SELECTION PAGE
             ===================================================== -->

        <div id="venue_selection">

            <div class="venue-selection-inner">


                <!-- =================================================
                     HEADING + DATE
                     ================================================= -->

                <div class="venue-top-row">


                    <h1>

                        Select Cinema & Showtime

                    </h1>


                    <!-- SELECTED DATE + SHOW TYPE -->

                    <div
                        id="selected_date_summary"
                        class="booking-info-pill">

                        Date: --

                    </div>


                </div>


                <!-- =================================================
                     DESCRIPTION
                     ================================================= -->

                <p>

                    Choose your preferred cinema and showtime
                    to continue to seat selection.

                </p>


                <!-- =================================================
                     VENUE LIST
                     ================================================= -->

                <div
                    id="venue_list"
                    class="venue-list">

                    <div class="venue-loading">

                        Loading cinemas...

                    </div>

                </div>


                <!-- =================================================
                     CONTINUE
                     ================================================= -->

                <button
                    id="venue_continue_button"
                    type="button">

                    CONTINUE TO SEAT SELECTION

                </button>


            </div>

        </div>


    </div>


    <!-- JAVASCRIPT -->

    <script src="function.js"></script>


</body>

</html>
